<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Voice Shell</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e;
    --master:#3fb950; --bystander:#d29922; --code:#58a6ff; --chat:#bc8cff; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
       background:var(--bg);color:var(--text);
       font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-tap-highlight-color:transparent}
  h1{font-size:15px;margin:0 0 12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
        color:var(--dim);font:inherit;font-size:13px;cursor:pointer}
  .chip[aria-pressed="true"]{color:var(--text);border-color:var(--code)}
  .chip:focus-visible{outline:2px solid var(--code);outline-offset:2px}
  #state{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);
         border-radius:10px;background:var(--panel);margin-bottom:12px}
  #dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
  #dot.LISTENING{background:var(--master)} #dot.THINKING{background:var(--code)}
  #dot.SPEAKING{background:var(--chat)} #dot.WORKING{background:var(--bystander)}
  input{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
        color:var(--text);font:inherit;font-size:13px;flex:1;min-width:160px}
  #ptt{width:100%;padding:30px;font:inherit;font-size:17px;border-radius:14px;border:1px solid var(--line);
       background:var(--panel);color:var(--text);touch-action:manipulation;cursor:pointer}
  #ptt.on{border-color:var(--master);color:var(--master)}
  #ptt:focus-visible{outline:2px solid var(--code);outline-offset:2px}
  #meter{height:6px;border-radius:3px;background:var(--line);margin:12px 0;overflow:hidden}
  #meterfill{height:100%;width:0;background:var(--master);transition:width .06s linear}
  #log{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .msg{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .msg .who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .msg.master .who{color:var(--master)} .msg.bystander .who{color:var(--bystander)}
  .msg.code .who{color:var(--code)} .msg.chat .who{color:var(--chat)} .msg.error .who{color:var(--err)}
  .hint{color:var(--dim);font-size:12px;margin:8px 0 0}
  .box{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px}
  a.chip{text-decoration:none;display:inline-block}
</style>
</head>
<body>
<h1>Voice Shell</h1>

<div id="state"><span id="dot"></span><span id="statetext"></span></div>

<div class="row" id="tokenrow" hidden>
  <input id="tokeninput" autocomplete="off">
  <button class="chip" id="tokensave" type="button"></button>
</div>

<div class="row">
  <button class="chip" id="t-auto" aria-pressed="true" type="button"></button>
  <button class="chip" id="t-code" aria-pressed="false" type="button"></button>
  <button class="chip" id="t-chat" aria-pressed="false" type="button"></button>
  <button class="chip" id="t-note" aria-pressed="false" type="button"></button>
</div>

<div class="row">
  <button class="chip" id="follow" aria-pressed="true" type="button"></button>
  <button class="chip" id="always" aria-pressed="false" type="button"></button>
  <button class="chip" id="lang" type="button"></button>
  <button class="chip" id="ambient" aria-pressed="false" type="button">ambient: off</button>
  <button class="chip" id="bystander" hidden aria-pressed="false" type="button"></button>
</div>
<p class="hint" id="bystanderhint" hidden></p>

<div class="box" id="authbox" hidden>
  <div class="hint" id="authtext" style="margin:0 0 8px"></div>
  <div class="row" style="margin:0">
    <button class="chip" id="authstart" type="button"></button>
    <a class="chip" id="authlink" hidden target="_blank" rel="noopener"></a>
  </div>
  <div class="row" id="authcoderow" hidden style="margin:8px 0 0">
    <input id="authcode" autocomplete="off">
    <button class="chip" id="authsend" type="button"></button>
  </div>
  <div id="authtoken" hidden style="margin-top:8px">
    <div class="hint" id="authtokenhint" style="margin:0 0 6px"></div>
    <div class="row" style="margin:0">
      <input id="authtokenvalue" readonly>
      <button class="chip" id="authcopy" type="button"></button>
    </div>
  </div>
</div>

<button id="ptt" type="button"></button>
<div id="meter"><div id="meterfill"></div></div>
<p class="hint" id="hint"></p>
<p class="hint" id="mediahint"></p>
<div id="log"></div>

let lang = localStorage.getItem("vs_lang") || matchBrowser();
function matchBrowser(){
  const want = (navigator.language || "en").toLowerCase();
  const hit = LANGS.find(l => want.startsWith(l.code.slice(0, 2)));
  return hit ? hit.code : "en-US";
}
/* Иврит оболочка пока не переводит — интерфейс на нём остаётся английским. */
function ui(){ return UI[lang.slice(0, 2)] || UI.en; }
function T(key){ return ui()[key] !== undefined ? ui()[key] : UI.en[key]; }

let ws = null, recog = null, audioCtx = null, analyser = null;
let listening = false, speaking = false, connected = false;
let followUntil = 0, always = false, follow = true;
let noiseFloor = -60, baseline = null, seg = null;

/* ---------- звуки ---------- */
function earcon(kind){
  try {
    const ctx = audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    const tones = {activation:[[880,.09]], accepted:[[560,.05]], error:[[300,.14]],
                   needs_approval:[[740,.06],[740,.06]], finished:[[660,.1],[990,.12]],
                   to_code:[[420,.06]], to_chat:[[900,.06]]}[kind] || [[700,.06]];
    let t = ctx.currentTime;
    for (const [freq, dur] of tones){
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = freq; osc.type = "sine";
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + .01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + dur + .02);
      t += dur + .04;
    }
  } catch (e) {}
}

/* ---------- кнопка наушников через медиа-сессию ---------- */
function silentTrack(seconds){
  const rate = 8000, samples = rate * seconds, buf = new ArrayBuffer(44 + samples * 2);
  const view = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF"); view.setUint32(4, 36 + samples * 2, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, "data"); view.setUint32(40, samples * 2, true);
  return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
}

let mediaAudio = null;
async function armHeadsetButton(){
  if (mediaAudio || !("mediaSession" in navigator)) return;
  try {
    mediaAudio = new Audio(silentTrack(2));
    mediaAudio.loop = true; mediaAudio.volume = 0.0001;
    await mediaAudio.play();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "Voice Shell", artist: "Claude", album: "voice shell"
    });
    navigator.mediaSession.playbackState = "playing";
    for (const action of ["play", "pause", "stop", "nexttrack", "previoustrack"]){
      try { navigator.mediaSession.setActionHandler(action, () => { toggleListen(); }); } catch (e) {}
    }
    el("mediahint").textContent = T("headsetOn");
  } catch (e) {
    mediaAudio = null;
    el("mediahint").textContent = T("headsetFail") + (e.name || e) + ")";
  }
}

/* ---------- микрофон: уровень, шумовой пол, ВЧ ---------- */
async function startMeter(){
  const stream = await navigator.mediaDevices.getUserMedia({audio:{
    echoCancellation:true, noiseSuppression:false, autoGainControl:false}});
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  const time = new Float32Array(analyser.fftSize), freq = new Float32Array(analyser.frequencyBinCount);
  setInterval(() => {
    analyser.getFloatTimeDomainData(time); analyser.getFloatFrequencyData(freq);
    let sum = 0; for (const v of time) sum += v * v;
    const db = 20 * Math.log10(Math.sqrt(sum / time.length) + 1e-9);
    el("meterfill").style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + "%";
    if (!listening) { noiseFloor = Math.min(-25, noiseFloor * .98 + db * .02); return; }
    const bin = audioCtx.sampleRate / analyser.fftSize;
    let lo = 0, hi = 0, nlo = 0, nhi = 0;
    freq.forEach((v, i) => { const f = i * bin;
      if (f > 200 && f < 1000){ lo += v; nlo++; } else if (f > 2000 && f < 8000){ hi += v; nhi++; } });
    seg = seg || {peak:-90, hf:0, frames:0, start:Date.now()};
    seg.peak = Math.max(seg.peak, db);
    seg.hf = (nhi ? hi / nhi : 0) - (nlo ? lo / nlo : 0);
    seg.frames++;
  }, 50);
}

function features(){
  const s = seg || {peak:-30, hf:0, frames:20, start:Date.now()};
  if (baseline === null && s.peak > -45) baseline = s.peak;
  return {level_rel_db: s.peak - (baseline === null ? s.peak : baseline),
          snr_db: s.peak - noiseFloor, hf_ratio_db: s.hf, lf_proximity_db: 2.0};
}

/* ---------- слушание ---------- */
function ensureRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ el("hint").textContent = T("needChrome"); return null; }
  if (recog) return recog;
  recog = new SR();
  recog.lang = lang; recog.interimResults = false; recog.continuous = false;
  recog.onresult = ev => {
    const text = (ev.results[ev.results.length - 1][0].transcript || "").trim();
    if (!text) return;
    const stop = stopIntent(text);
    if (stop){
      speechSynthesis.cancel(); speaking = false;
      send({id:"interrupt", scope:stop});
      addMsg(T("me"), stop === "work" ? T("stoppingWork") : T("quiet"), "master");
      earcon("accepted");
      return;
    }
    if (always && !wakeMatched(text)) { addMsg(T("past"), text, "bystander"); return; }
    const payload = stripWake(text);
    addMsg(T("me"), payload, "master");
    earcon("accepted");
    const s = seg || {frames:20, start:Date.now()};
    send({id:"speech_segment", segment_id:String(Date.now()), transcript:payload,
          device:"phone_mic", duration_ms:Math.max(400, Date.now() - (s.start || Date.now())),
          voiced_frames:Math.max(12, s.frames || 20), features:features()});
  };
  recog.onerror = ev => {
    if (ev.error === "not-allowed"){ el("hint").textContent = T("micDenied"); }
    else if (ev.error !== "no-speech" && ev.error !== "aborted"){ earcon("error"); }
  };
  recog.onend = () => {
    listening = false; seg = null; paintButton();
    if (always) { setTimeout(startListen, 250); return; }
    if (follow && Date.now() < followUntil) setTimeout(startListen, 150);
  };
  return recog;
}

/* «Стоп» работает всегда — до обращения и без него. */
function stopIntent(text){
  const t = text.toLowerCase().replace(/[^\wа-яё\u4e00-\u9fff\s']/gi, " ").replace(/\s+/g, " ").trim();
  const bare = t.replace(new RegExp("^(" + WAKE_WORDS.join("|") + ")\\s+"), "");
  const hit = (phrase) => bare === phrase || bare.startsWith(phrase + " ")
                          || (/[\u4e00-\u9fff]/.test(phrase) && bare.startsWith(phrase));
  for (const phrase of STOP_WORK) if (hit(phrase)) return "work";
  for (const phrase of STOP_VOICE) if (hit(phrase)) return "voice";
  return null;
}

function wakeMatched(text){
  const lowered = text.toLowerCase();
  if (/^\s*克劳德/.test(lowered)) return true;
  const first = lowered.replace(/[^\wа-яё\s]/gi, " ").trim().split(/\s+/)[0] || "";
  return WAKE_WORDS.includes(first);
}
function stripWake(text){
  if (!wakeMatched(text)) return text;
  return text.replace(/^[^\wа-яё]*[\wа-яё]+[\s,.!?]*/i, "").trim() || text;
}

function startListen(){
  const r = ensureRecognition();
  if (!r || listening) return;
  if (speaking){ speechSynthesis.cancel(); speaking = false; send({id:"barge_in", ts:Date.now()}); }
  seg = {peak:-90, hf:0, frames:0, start:Date.now()};
  try { r.start(); listening = true; if (!always) earcon("activation"); paintButton(); }
  catch (e) { /* уже запущено */ }
}
function stopListen(){ if (recog && listening) { try { recog.stop(); } catch (e) {} } }
function toggleListen(){ armHeadsetButton(); listening ? stopListen() : startListen(); }

function paintButton(){
  el("ptt").classList.toggle("on", listening);
  el("ptt").textContent = listening ? T("pttListening")
                        : always ? T("pttAlways")
                        : T("ptt");
}

el("ptt").addEventListener("click", toggleListen);

/* ---------- чипы ---------- */
let forced = null;
for (const id of ["auto","code","chat","note"]){
  el("t-" + id).onclick = () => {
    forced = id === "auto" ? null : id;
    for (const other of ["auto","code","chat","note"])
      el("t-" + other).setAttribute("aria-pressed", String(other === id));
    send({id:"target_switch", target:forced});
  };
}
el("follow").onclick = () => {
  follow = !follow;
  paintUI();
};
el("always").onclick = () => {
  always = !always;
  paintUI();
  armHeadsetButton();
  always ? startListen() : stopListen();
};
el("lang").onclick = () => {
  const next = (LANGS.findIndex(l => l.code === lang) + 1) % LANGS.length;
  lang = LANGS[next].code;
  try { localStorage.setItem("vs_lang", lang); } catch (e) {}
  if (recog) { try { recog.abort(); } catch (e) {} recog = null; }
  document.documentElement.lang = lang.slice(0, 2);
  paintUI();
  /* Демон отвечает на языке телефона, пока не услышит другой. */
  send({id:"hello", v:1, token:TOKEN, device_id:"web", app_version:"0.3.0", language:lang});
};

/* Один проход по всем надписям: язык меняется чипом, и половина интерфейса,
   нарисованная один раз при загрузке, иначе осталась бы на прежнем. */
function paintUI(){
  const set = (id, text) => { const node = el(id); if (node) node.textContent = text; };
  const place = (id, text) => { const node = el(id); if (node) node.placeholder = text; };
  if (!connected) set("statetext", T("notConnected"));
  place("tokeninput", T("token"));
  set("tokensave", T("save"));
  set("t-auto", T("auto")); set("t-code", T("code"));
  set("t-chat", T("chat")); set("t-note", T("note"));
  set("follow", T("follow") + (follow ? T("on") : T("off")));
  el("follow").setAttribute("aria-pressed", String(follow));
  set("always", T("always") + (always ? T("on") : T("off")));
  el("always").setAttribute("aria-pressed", String(always));
  set("lang", T("language") + (LANGS.find(l => l.code === lang) || LANGS[0]).name);
  set("bystander", T("bystander") + (bystander ? T("on") : T("off")));
  set("bystanderhint", T("bystanderHint"));
  if (!authStarted) set("authtext", T("authIntro"));
  set("authstart", T("authStart"));
  set("authlink", T("authLink"));
  place("authcode", T("authCode"));
  set("authsend", T("authSend"));
  set("authcopy", T("copy"));
  const hint = el("authtokenhint");
  if (hint) hint.innerHTML = String(T("tokenHint")).replace(/</g, "&lt;")
                             + "<code>CLAUDE_CODE_OAUTH_TOKEN</code>.";
  if (!hintOwned) set("hint", connected ? "" : T("connecting"));
  set("mediahint", mediaAudio ? T("headsetOn") : T("headsetOff"));
  paintButton();
}

let ambient = "off", bystander = false;
/* Две надписи живут своей жизнью: их занимают сообщения от демона, и
   перерисовка по смене языка не должна их затирать. */
let authStarted = false, hintOwned = false;
el("ambient").onclick = () => {
  ambient = {off:"passive", passive:"assist", assist:"off"}[ambient];
  el("ambient").textContent = "ambient: " + ambient;
  el("ambient").setAttribute("aria-pressed", String(ambient !== "off"));
  el("bystander").hidden = ambient === "off";
  if (ambient === "off"){ bystander = false;
                          el("bystander").setAttribute("aria-pressed","false");
                          el("bystanderhint").hidden = true; paintUI(); }
  send({id:"ambient_control", submode:ambient, bystander_transcript:bystander, wipe:ambient === "off"});
};
el("bystander").onclick = () => {
  bystander = !bystander;
  paintUI();
  el("bystander").setAttribute("aria-pressed", String(bystander));
  el("bystanderhint").hidden = !bystander;
  send({id:"ambient_control", bystander_transcript:bystander});
};

/* ---------- подписка ---------- */
el("authstart").onclick = () => {
  authStarted = true;
  el("authstart").textContent = T("askingLink");
  send({id:"auth_start"});
};
el("authsend").onclick = () => {
  const code = el("authcode").value.trim();
  if (code) { authStarted = true; el("authtext").textContent = T("checkingCode");
              send({id:"auth_code", code}); }
};
el("authcopy").onclick = async () => {
  try { await navigator.clipboard.writeText(el("authtokenvalue").value); el("authcopy").textContent = T("copied"); }
  catch (e) { el("authtokenvalue").select(); }
};
el("tokensave").onclick = () => {
  TOKEN = el("tokeninput").value.trim();
  if (!TOKEN) return;
  try { localStorage.setItem("vs_token", TOKEN); } catch (e) {}
  el("tokenrow").hidden = true;
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
  connect();
};

/* ---------- связь ---------- */
function send(obj){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function setState(s){ el("dot").className = s; el("statetext").textContent = s; }
function addMsg(who, text, cls){
  const div = document.createElement("div");
  div.className = "msg " + (cls || who);
  div.innerHTML = `<div class="who">${who}</div><div>${String(text).replace(/</g,"&lt;")}</div>`;
  el("log").prepend(div);
  while (el("log").children.length > 40) el("log").lastChild.remove();
}
/* Язык ответа — по письменности самого ответа, а не по переключателю. */
function scriptLang(text){
  if (/[\u0590-\u05FF]/.test(text)) return "he-IL";
  if (/[\u4e00-\u9fff]/.test(text)) return "zh-CN";
  if (/[\u0400-\u04FF]/.test(text)) return "ru-RU";
  if (/[A-Za-z]/.test(text)) return lang.startsWith("es") ? "es-ES" : "en-US";
  return lang;
}
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = scriptLang(text); u.rate = 1.05;
  u.onstart = () => { speaking = true; };
  u.onend = () => {
    speaking = false;
    followUntil = Date.now() + FOLLOW_MS;
    if (follow && !always) startListen();
  };
  speechSynthesis.speak(u);
}
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    connected = true; setState("IDLE");
    if (!TOKEN){ el("tokenrow").hidden = false; hintOwned = true;
                 el("hint").textContent = T("needToken"); return; }
    hintOwned = false;
    send({id:"hello", v:1, token:TOKEN, device_id:"web", app_version:"0.3.0", language:lang});
  };
  ws.onclose = () => { connected = false; setState(T("noLink")); setTimeout(connect, 2000); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.id === "welcome"){
      const cred = {subscription:T("subscription"), api_key:T("apiKey"),
                    none:T("noAccess")}[m.credential] || m.credential;
      hintOwned = true;
      el("hint").textContent = `code: ${m.code_available?"ready":"stub"} · chat: ${m.chat_available?"ready":"stub"} · ${cred}`;
      el("authbox").hidden = m.credential !== "none";
      el("tokenrow").hidden = true;
    } else if (m.id === "state"){ setState(m.state);
    } else if (m.id === "route"){
      if (m.earcon) earcon(m.earcon);
      if (!m.target && m.reason !== "auto") addMsg(m.label || m.reason, T("notRun") + m.reason, "bystander");
    } else if (m.id === "voice_summary"){
      addMsg(m.target, m.text, m.target); speak(m.text);
      earcon(m.is_question ? "needs_approval" : "finished");
    } else if (m.id === "permission_request"){
      earcon("needs_approval"); addMsg(T("permission"), m.spoken, "code"); speak(m.spoken);
    } else if (m.id === "permission_result"){
      earcon(m.earcon || "accepted");
      addMsg(T("permission"), m.approved ? (m.remembered ? T("allowedKept") : T("allowed"))
                                        : T("rejected"), "code");
    } else if (m.id === "auth_url"){
      el("authstart").hidden = true;
      el("authlink").hidden = false; el("authlink").href = m.url;
      el("authcoderow").hidden = false;
      el("authtext").textContent = T("authOpen");
    } else if (m.id === "auth_token"){
      el("authcoderow").hidden = true; el("authlink").hidden = true;
      el("authtoken").hidden = false; el("authtokenvalue").value = m.token;
      el("authtext").textContent = T("authDone");
      hintOwned = true;
      el("hint").textContent = `code: ${m.code_available?"ready":"stub"} · chat: ${m.chat_available?"ready":"stub"} · ${T("subscription")}`;
      earcon("finished");
    } else if (m.id === "auth_error"){
      earcon("error");
      el("authtext").textContent = T("authFailed") + m.message;
      el("authstart").hidden = false; el("authstart").textContent = T("authRestart");
      el("authcoderow").hidden = true; el("authlink").hidden = true;
    } else if (m.id === "whisper"){ addMsg(T("whisper"), m.text, "chat"); speak(m.text);
    } else if (m.id === "error"){
      earcon("error"); addMsg(T("error"), m.message, "error");
      if (m.code === "unauthorized"){
        try { localStorage.removeItem("vs_token"); } catch (e) {}
        TOKEN = ""; el("tokenrow").hidden = false;
      }
    }
  };
}

document.documentElement.lang = lang.slice(0, 2);
paintUI();
if (!window.isSecureContext && location.hostname !== "localhost"){
  hintOwned = true; el("hint").textContent = T("needHttps");
}
startMeter().catch(() => { hintOwned = true; el("hint").textContent = T("noMic"); });
connect();
</script>
