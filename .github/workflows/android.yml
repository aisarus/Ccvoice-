name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Без packages действие тянет устаревший пакет "tools", которого больше нет.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # Запасной путь: некоторые браузеры и сети не дают докачать .apk,
      # а такой же файл в .zip проходит спокойно.
      - name: Упаковать запасную копию
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk voice-shell.apk
          zip -q voice-shell-apk.zip voice-shell.apk
          sha256sum app-debug.apk voice-shell-apk.zip > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voice-shell-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Ставим и запускаем на эмуляторе: сборка, которая падает при старте,
      # не должна доезжать до телефона.
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверить на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.voiceshell/.MainActivity
            sleep 8
            adb logcat -d -b crash > crash.log || true
            if [ -s crash.log ]; then
              echo "::error::приложение упало при старте"
              cat crash.log
              exit 1
            fi
            if [ -z "$(adb shell pidof com.voiceshell | tr -d '\r')" ]; then
              echo "::error::процесс не живёт после запуска"
              adb logcat -d | tail -100
              exit 1
            fi
            echo "приложение запустилось и живёт"
            # Разрешения выдаём принудительно и проверяем, что служба поднимается.
            adb shell pm grant com.voiceshell android.permission.RECORD_AUDIO
            adb shell pm grant com.voiceshell android.permission.POST_NOTIFICATIONS
            adb shell am start-foreground-service -n com.voiceshell/.VoiceService || true
            sleep 6
            adb logcat -d -b crash > crash2.log || true
            if [ -s crash2.log ]; then
              echo "::error::служба упала"
              cat crash2.log
              exit 1
            fi
            echo "служба не падает"

      # Ссылка, которую можно открыть с телефона без входа в GitHub.
      - name: Выложить в релиз
        if: github.ref_name == 'claude/voice-shell-claude-code-77wwh2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voice Shell APK
          body: |
            Свежая сборка приложения.

            - `app-debug.apk` — обычный файл, ставится сразу.
            - `voice-shell-apk.zip` — то же самое в архиве, если браузер не даёт докачать apk:
              скачай, распакуй файловым менеджером и поставь `voice-shell.apk`.
            - `checksums.txt` — контрольные суммы.

            Все сборки подписаны одним ключом, поэтому обновление ставится поверх
            предыдущего без удаления.
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/voice-shell-apk.zip
            android/app/build/outputs/apk/debug/checksums.txt
