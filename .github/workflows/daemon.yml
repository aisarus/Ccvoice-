name: daemon

on:
  push:
    paths:
      - "daemon/**"
      - "tests/**"
      - "spec/**"
      - "scripts/**"
      - ".github/workflows/daemon.yml"
  pull_request:
  workflow_dispatch:

# Ничего никуда не выкладывается — значит и права на запись не нужны.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Одна упавшая версия не повод скрывать результат второй.
      fail-fast: false
      matrix:
        # 3.12 — то, на чём демон живёт в контейнере; 3.11 — то, что стоит на
        # обычном сервере. Ломается обычно как раз одна из двух, не обе.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: daemon/requirements-dev.txt

      # Ставим ровно то, что CONTRIBUTING велит ставить у себя: иначе CI
      # проверяет не ту установку, которую человек делает руками.
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r daemon/requirements-dev.txt

      # Спека — источник правды, и валидатор ловит расхождения раньше тестов.
      - name: Проверить спеку
        run: python3 scripts/validate_spec.py

      - name: Тесты
        run: python3 -m pytest tests -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bash сообщает об ошибке в скрипте только в момент, когда до неё
      # доходит, — то есть уже после того, как человек ввёл токен и половина
      # настройки сделана. Здесь она находится до того, как скрипт кому-то дали.
      - name: Проверить скрипты
        run: shellcheck --severity=warning scripts/*.sh android/smoke-test.sh
