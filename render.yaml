# Render Blueprint: New → Blueprint → выбрать этот репозиторий → Apply.
services:
  - type: web
    name: voice-shell
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Пароль от голосового доступа. Render сгенерирует сам.
      - key: VOICE_TOKEN
        generateValue: true
      # Подписка Claude. Можно оставить пустым и подключить прямо из приложения:
      # кнопка «подключить подписку» проведёт через claude setup-token, а токен
      # потом вставляется сюда, чтобы пережить перезапуск.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      # Альтернатива подписке: обычный API-ключ с оплатой по токенам.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Необязательно: репозиторий, в котором Claude Code будет работать.
      - key: WORKSPACE_REPO
        sync: false
      # Необязательно: токен GitHub, чтобы работа пушилась, а не терялась.
      - key: GITHUB_TOKEN
        sync: false
      - key: AMBIENT_SUBMODE
        value: "off"
